[hidden] { display: none !important; }

body { background: var(--papier); color: var(--tinte); font: 17px/1.5 "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid var(--blau); outline-offset: 2px; }
h1, h2, h3, .schrift { font-family: "Delius", "Avenir Next", sans-serif; font-weight: 400; line-height: 1.2; }
b { font-weight: 700; }
.huelle { width: min(980px, 100%); margin: 0 auto; padding: 0 16px 48px; }
.klein { font-size: 15px; color: var(--grau); }

/* Kopf mit Fortschritt als Element-Kacheln */
.kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; flex-wrap: wrap; }
.marke { display: flex; align-items: center; gap: 10px; font: 21px "Delius", sans-serif; color: var(--gruen-tief); background: none; border: 0; min-height: 44px; padding: 0; }
.marke img { width: 40px; height: 40px; }
.leiste { display: flex; gap: 6px; }
.mini { width: 44px; height: 44px; border-radius: 9px; border: 2px solid var(--linie); background: #fff; display: grid; place-items: center; font: 700 15px "Avenir Next", sans-serif; color: var(--grau); position: relative; }
.mini.fertig { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.mini.heft { border-style: dashed; }
.mini.heft.offen { background: var(--gelb); border: 2px solid #d9a91d; color: var(--tinte); }

/* Start */
.held { display: grid; grid-template-columns: 1fr 240px; gap: 18px; align-items: center; background: var(--karte); border: 1px solid var(--linie); border-radius: var(--r); box-shadow: var(--schatten); padding: 28px; }
.held h1 { font-size: clamp(30px, 4.6vw, 44px); color: var(--gruen-tief); margin: 6px 0 10px; }
.held img { width: 100%; max-width: 230px; display: block; margin: 0 auto; animation: wippen 5s ease-in-out infinite; }
@keyframes wippen { 50% { transform: translateY(-8px) rotate(-2deg); } }
.ueber { color: var(--gruen-tief); font-size: 14px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.so-gehts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.so-gehts span { background: var(--gruen-hell); color: var(--gruen-tief); border-radius: 999px; padding: 6px 14px; font-size: 15px; font-weight: 600; }
.abschnitt { font-size: 26px; color: var(--gruen-tief); margin: 28px 0 12px; }
.kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.kachel { position: relative; text-align: left; border: 2px solid var(--linie); background: var(--karte); border-radius: 18px; padding: 14px 16px 16px; min-height: 250px; display: flex; flex-direction: column; box-shadow: var(--schatten); transition: transform .15s; }
.kachel:hover:not([disabled]) { transform: translateY(-3px); }
.kachel .ord { position: absolute; top: 10px; left: 14px; font-weight: 800; color: var(--grau); }
.kachel .sym { position: absolute; top: 6px; right: 14px; font: 34px "Delius", sans-serif; color: var(--gruen-tief); opacity: .9; }
.kachel img { width: 100%; height: 118px; object-fit: contain; margin: 26px 0 8px; }
.kachel b { font: 21px "Delius", sans-serif; }
.kachel small { color: var(--grau); font-size: 15px; }
.kachel .status { margin-top: auto; padding-top: 8px; font-size: 14px; font-weight: 700; color: var(--gruen-tief); }
.kachel.gruen { background: var(--gruen-hell); } .kachel.gelb { background: var(--gelb-hell); } .kachel.blau { background: var(--blau-hell); } .kachel.koralle { background: var(--koralle-hell); }
.kachel.fertig { border-color: var(--gruen); }
.kachel[disabled] { opacity: .55; cursor: default; filter: grayscale(.5); }
.kachel.heftkachel { background: #fff; border-style: dashed; align-items: center; justify-content: center; text-align: center; gap: 8px; }
.kachel.heftkachel.offen { border: 3px solid var(--gelb); background: var(--gelb-hell); animation: puls 2s ease-in-out infinite; }
@keyframes puls { 50% { box-shadow: 0 0 0 8px rgba(255, 210, 77, .35); } }
.schloss { width: 54px; height: 54px; color: var(--grau); }

/* Quiz-Rahmen (Vorlage Interactive Quiz) */
.rahmen { background: var(--karte); border: 1px solid var(--linie); border-radius: var(--r); box-shadow: var(--schatten); padding: 26px; }
.rahmen-kopf { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.rahmen-kopf img { width: 72px; height: 72px; object-fit: contain; }
.rahmen-kopf h1 { font-size: clamp(26px, 3.8vw, 34px); color: var(--gruen-tief); }
.buch { margin-left: auto; font-size: 14px; color: var(--grau); background: var(--innen); border: 1px solid var(--linie); border-radius: 999px; padding: 4px 12px; }
.punkte { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
.punkte i { width: 26px; height: 8px; border-radius: 99px; background: var(--linie); }
.punkte i.da { background: var(--gruen); } .punkte i.jetzt { background: var(--gelb); }
.punkte i.zus { border: 2px dashed var(--gruen-mittel); background: none; }
.aufgabe { background: var(--innen); border: 1px solid var(--linie); border-radius: 18px; overflow: hidden; animation: rein .35s ease; }
@keyframes rein { from { opacity: 0; transform: translateY(10px); } }
.aufgabe-innen { padding: 24px; }
.schritt-nr { font-size: 14px; font-weight: 700; color: var(--grau); text-transform: uppercase; letter-spacing: .04em; }
.aufgabe h2 { font-size: clamp(24px, 3.4vw, 30px); margin: 4px 0 10px; }
.frage { font-size: 19px; margin-bottom: 16px; max-width: 66ch; }
.zusatz-marke { display: inline-block; background: var(--gelb); border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; margin-left: 8px; vertical-align: middle; }
.optionen { display: grid; gap: 10px; }
.option { text-align: left; min-height: 58px; padding: 14px 18px 14px 52px; border-radius: 14px; border: 2px solid var(--linie); background: #fff; font-weight: 600; line-height: 1.35; position: relative; transition: border-color .15s, background .15s; }
.option::before { content: ""; position: absolute; left: 18px; top: 50%; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%; border: 2px solid var(--gruen-mittel); background: #fff; }
.option:hover:not([disabled]) { border-color: var(--gruen-mittel); }
.option[aria-pressed="true"] { border-color: var(--gruen); background: var(--gruen-hell); }
.option[aria-pressed="true"]::before { border-color: var(--gruen); box-shadow: inset 0 0 0 4px #fff; background: var(--gruen); }
.option.richtig { border-color: var(--gruen); background: #dcf5e5; color: var(--gruen-tief); }
.option.richtig::before { background: var(--gruen); border-color: var(--gruen); }
.option.falsch { border-color: var(--rot); background: var(--koralle-hell); animation: wackeln .35s; }
.option[disabled] { cursor: default; }
.option.ohne-kreis { padding-left: 18px; }
.option.ohne-kreis::before { display: none; }
@keyframes wackeln { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.fusszeile { border-top: 1px solid var(--linie); background: #fff; padding: 18px 24px; display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; min-height: 86px; }
.rueck { flex: 1 1 320px; }
.rueck .zeile1 { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 18px; }
.rueck .zeile1 svg { width: 24px; height: 24px; flex: none; }
.rueck.ok .zeile1 { color: var(--gruen); } .rueck.nein .zeile1 { color: var(--rot); }
.rueck .zeile2 { display: flex; gap: 8px; color: var(--grau); margin-top: 4px; font-size: 16px; }
.rueck .zeile2 svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.knopf { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 14px; border: 0; background: var(--gruen); color: #fff; font-weight: 700; box-shadow: 0 3px 0 var(--gruen-tief); text-decoration: none; }
.knopf svg { width: 20px; height: 20px; }
.knopf:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--gruen-tief); }
.knopf.zwei { background: #fff; color: var(--gruen-tief); box-shadow: inset 0 0 0 2px var(--gruen-mittel), 0 3px 0 var(--gruen-mittel); }
.knopf[disabled] { opacity: .45; cursor: default; transform: none; }
.status-zeile { text-align: center; color: var(--grau); margin-top: 16px; font-size: 16px; }
.status-zeile b { color: var(--tinte); }
.link { background: none; border: 0; color: var(--gruen-tief); font-weight: 700; text-decoration: underline; min-height: 44px; padding: 0 4px; }

/* Wissen */
.wissen-text p { margin-bottom: 10px; max-width: 68ch; }
.wissen-liste { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 12px 0; }
.wissen-liste div { background: #fff; border: 1px solid var(--linie); border-left: 5px solid var(--gruen); border-radius: 12px; padding: 12px 14px; }
.wissen-liste b { display: block; color: var(--gruen-tief); margin-bottom: 2px; }
.merke { background: var(--gelb-hell); border-left: 5px solid var(--gelb); padding: 12px 14px; border-radius: 10px; margin-top: 8px; }
.merke::before { content: "Merke: "; font-weight: 800; }
.tabelle { border-collapse: collapse; margin-top: 12px; background: #fff; border-radius: 12px; overflow: hidden; width: 100%; max-width: 560px; }
.tabelle th, .tabelle td { padding: 8px 12px; border-bottom: 1px solid var(--linie); text-align: left; }
.tabelle th { background: var(--gruen-hell); color: var(--gruen-tief); }
.vorlesen { margin-top: 10px; }
.fall { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.fall img { width: 220px; max-width: 100%; border-radius: 14px; }
.fall p { flex: 1 1 280px; font-size: 20px; }
.akte-stempel { display: inline-block; border: 3px solid var(--rot); color: var(--rot); font-weight: 800; letter-spacing: .1em; padding: 2px 10px; border-radius: 6px; transform: rotate(-4deg); margin-bottom: 10px; }

/* Zuordnen */
.zuordnen { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.spalte { display: grid; gap: 10px; align-content: start; }
.ding { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 14px; text-align: left; border-radius: 14px; border: 2px solid var(--linie); background: #fff; font-weight: 600; line-height: 1.3; }
.ding img { width: 84px; height: 64px; object-fit: cover; border-radius: 10px; flex: none; }
.ding svg.kolben { width: 60px; height: 76px; flex: none; }
.ding[aria-pressed="true"] { border-color: var(--blau); background: var(--blau-hell); box-shadow: 0 0 0 3px rgba(47, 111, 214, .18); }
.ding.paar { border-color: var(--gruen-mittel); }
.ding .marker { margin-left: auto; min-width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; font-size: 15px; flex: none; }
.ding.falsch { border-color: var(--rot); background: var(--koralle-hell); }
.ding.richtig { border-color: var(--gruen); background: #dcf5e5; }

/* Reihe */
.reihe { display: grid; gap: 10px; max-width: 520px; }
.reihe button { display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--linie); background: #fff; font-weight: 600; text-align: left; }
.reihe .platz { width: 34px; height: 34px; border-radius: 50%; border: 2px dashed var(--gruen-mittel); display: grid; place-items: center; font-weight: 800; color: #fff; flex: none; }
.reihe button.gewaehlt { border-color: var(--gruen); background: var(--gruen-hell); }
.reihe button.gewaehlt .platz { background: var(--gruen); border: 0; }
.treppe-pfeil { display: flex; align-items: center; gap: 8px; color: var(--grau); font-size: 15px; margin-bottom: 8px; }

/* Lücke */
.luecken-satz { font-size: 21px; line-height: 2.3; background: #fff; border: 1px solid var(--linie); border-radius: 14px; padding: 14px 18px; }
.luecken-satz select { min-height: 46px; font-size: 19px; font-weight: 700; padding: 0 10px; border-radius: 10px; border: 2px solid var(--gruen-mittel); background: var(--gruen-hell); color: var(--gruen-tief); }
.luecken-satz select.falsch { border-color: var(--rot); background: var(--koralle-hell); color: var(--rot); }
.luecken-satz select.richtig { border-color: var(--gruen); background: #dcf5e5; }

/* Labor */
.labor { display: grid; grid-template-columns: 1.2fr 1fr; gap: 18px; }
.tisch { background: linear-gradient(#fff 0 62%, #efe4d6 62%); border: 1px solid var(--linie); border-radius: 16px; padding: 14px; display: grid; gap: 12px; }
.proben { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.probe { border: 2px solid var(--linie); border-radius: 12px; background: #fff; padding: 6px 4px; display: grid; justify-items: center; gap: 2px; font-size: 13px; font-weight: 700; min-height: 96px; }
.probe img { width: 100%; height: 58px; object-fit: contain; transition: transform .3s; }
.probe[aria-pressed="true"] { border-color: var(--blau); background: var(--blau-hell); }
.probe.fertig { border-color: var(--gruen-mittel); }
.werkzeuge { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.werkzeug { border: 2px solid var(--linie); border-radius: 12px; background: #fff; min-height: 88px; display: grid; justify-items: center; align-content: center; gap: 4px; font-size: 14px; font-weight: 700; }
.werkzeug svg { width: 40px; height: 40px; }
.werkzeug[disabled] { opacity: .45; }
.buehne { min-height: 170px; background: #fff; border: 1px dashed var(--gruen-mittel); border-radius: 14px; display: grid; place-items: center; padding: 10px; text-align: center; }
.buehne svg { width: 100%; max-width: 300px; height: 130px; }
.buehne .satz { font-weight: 700; margin-top: 4px; }
.laborbuch { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; font-size: 15px; }
.laborbuch th, .laborbuch td { border: 1px solid var(--linie); padding: 6px 4px; text-align: center; }
.laborbuch th { background: var(--gruen-hell); color: var(--gruen-tief); font-size: 13px; }
.laborbuch td:first-child { text-align: left; font-weight: 700; padding-left: 8px; }
.laborbuch .ja { color: var(--gruen); font-weight: 800; } .laborbuch .nein { color: var(--rot); font-weight: 800; }
.sortieren { margin-top: 16px; display: grid; gap: 8px; }
.sort-zeile { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border: 2px solid var(--linie); border-radius: 14px; padding: 8px 12px; background: #fff; }
.sort-zeile.falsch { border-color: var(--rot); background: var(--koralle-hell); }
.sort-zeile.richtig { border-color: var(--gruen); }
.segment { display: inline-flex; background: var(--gruen-hell); border-radius: 999px; padding: 4px; gap: 4px; }
.segment button { min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: none; font-weight: 700; color: var(--gruen-tief); }
.segment button[aria-pressed="true"] { background: var(--gruen); color: #fff; }
/* Animationen auf der Bühne */
.leuchten { animation: leuchten 1s ease-in-out infinite alternate; }
@keyframes leuchten { from { opacity: .55; } to { opacity: 1; } }
.schlag { animation: schlag .6s ease-in; transform-origin: 80% 80%; }
@keyframes schlag { 0% { transform: rotate(-35deg); } 60% { transform: rotate(8deg); } 100% { transform: rotate(0); } }
.welle { animation: welle 1.4s linear infinite; }
@keyframes welle { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }
.funkeln { animation: funkeln 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes funkeln { 50% { transform: scale(1.5) rotate(20deg); opacity: .4; } }
.brocken { animation: brocken .8s ease-out forwards; }
@keyframes brocken { to { transform: translate(var(--dx), 30px) rotate(var(--dr)); opacity: .8; } }

/* Periodensystem */
.pse-bereich { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
.pse { display: grid; grid-template-columns: 26px repeat(8, minmax(0, 1fr)); gap: 3px; background: #fff; border: 1px solid var(--linie); border-radius: 14px; padding: 8px; }
.pse .kopfz { font-size: 12px; font-weight: 700; color: var(--grau); text-align: center; align-self: end; }
.pse .per { font-size: 12px; font-weight: 700; color: var(--grau); display: grid; place-items: center; }
.zelle { aspect-ratio: 1; min-height: 34px; border-radius: 6px; border: 1px solid #c9d8cd; background: #f1f4f2; display: grid; place-items: center; font-weight: 700; font-size: clamp(12px, 1.8vw, 16px); padding: 0; transition: background .4s, transform .2s; }
.zelle.m { background: var(--metall); border-color: #b07650; color: #3a2414; }
.zelle.h { background: var(--halb); border-color: #d9aa4a; }
.zelle.n { background: var(--nicht); border-color: #d6c440; }
.zelle.ziel { outline: 3px solid var(--blau); outline-offset: 1px; transform: scale(1.08); z-index: 1; }
.zelle.markiert { background: var(--halb); border: 2px solid var(--gelb); }
.zelle.falsch { background: var(--koralle-hell); border: 2px solid var(--rot); }
.zelle.neu { animation: plopp .45s ease; }
@keyframes plopp { 50% { transform: scale(1.18); } }
button.zelle { cursor: pointer; }
.legende { display: flex; gap: 12px; flex-wrap: wrap; font-size: 14px; margin-top: 8px; }
.legende span { display: inline-flex; align-items: center; gap: 6px; }
.legende i { width: 18px; height: 18px; border-radius: 4px; display: inline-block; border: 1px solid rgba(0, 0, 0, .15); }
.steckbrief { background: #fff; border: 2px solid var(--linie); border-radius: 16px; padding: 16px; }
.steckbrief .sym-gross { width: 76px; height: 76px; border: 2px solid var(--tinte); border-radius: 10px; display: grid; place-items: center; font: 34px "Delius", sans-serif; margin-bottom: 8px; }
.steckbrief p { margin-bottom: 12px; font-size: 18px; }
.arten { display: grid; gap: 8px; }
.arten button { min-height: 52px; border-radius: 12px; border: 2px solid rgba(0, 0, 0, .12); font-weight: 700; }
.arten .m { background: var(--metall); } .arten .h { background: var(--halb); } .arten .n { background: var(--nicht); }
.arten button.falsch { animation: wackeln .35s; outline: 3px solid var(--rot); }
.zaehler { font-size: 14px; color: var(--grau); margin-top: 10px; }

/* Chat */
.chat { background: #eef3f0; border-radius: 18px; padding: 14px; display: grid; gap: 10px; max-width: 640px; }
.chat-kopf { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--linie); font-weight: 700; }
.atom { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: #fff; flex: none; }
.atom.c { background: #4b5560; } .atom.ar { background: #8a6fd1; }
.blase { max-width: 80%; padding: 10px 14px; border-radius: 18px; line-height: 1.4; animation: rein .3s ease; }
.blase.c { background: #fff; border-bottom-left-radius: 4px; justify-self: start; }
.blase.ar { background: #e3dcfa; border-bottom-right-radius: 4px; justify-self: end; }
.zeile-c, .zeile-ar { display: flex; gap: 8px; align-items: flex-end; }
.zeile-ar { justify-content: flex-end; }
.tippt { display: inline-flex; gap: 4px; padding: 12px 14px; background: #fff; border-radius: 18px; }
.tippt i { width: 7px; height: 7px; border-radius: 50%; background: var(--grau); animation: tippt 1s infinite; }
.tippt i:nth-child(2) { animation-delay: .15s; } .tippt i:nth-child(3) { animation-delay: .3s; }
@keyframes tippt { 50% { transform: translateY(-4px); opacity: .4; } }
.antworten { display: grid; gap: 8px; margin-top: 4px; }
.antworten button { text-align: left; min-height: 52px; padding: 10px 14px; border-radius: 14px; border: 2px solid #c9bdf0; background: #fff; font-weight: 600; }
.antworten button.falsch { border-color: var(--rot); background: var(--koralle-hell); animation: wackeln .35s; }
.chat-hinweis { font-size: 15px; color: var(--rot); font-weight: 600; }
.schale-bild { display: grid; place-items: center; margin-bottom: 14px; }
.schale-bild svg { width: 220px; height: 220px; }
.frage-bild { width: 100%; max-width: 420px; border-radius: 14px; display: block; margin-bottom: 14px; }

/* Abschluss / Hefteintrag */
.heft-blatt { background: #fff; border: 1px solid var(--linie); border-radius: var(--r); box-shadow: var(--schatten); padding: 30px clamp(18px, 4vw, 44px); }
.heft-teil { margin-bottom: 26px; }
.heft-teil h2 { display: table; margin: 0 auto 14px; background: #7cf75a; color: #000; font: 800 clamp(24px, 3.4vw, 32px) "Avenir Next", "Century Gothic", sans-serif; padding: 2px 10px; }
.heft-teil ul { padding-left: 26px; display: grid; gap: 4px; font-size: 19px; }
.heft-pse { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
.heft-pse .pse { width: min(420px, 100%); }
.heft-pse .legende { flex-direction: column; font-size: 17px; }
.heft-pse .legende i { width: 60px; height: 22px; }
.feier { text-align: center; margin-bottom: 18px; }
.feier h1 { font-size: clamp(28px, 4vw, 40px); color: var(--gruen-tief); }
.code-feld { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.code-feld input { min-height: 48px; border-radius: 12px; border: 2px solid var(--gruen-mittel); padding: 0 12px; font-size: 18px; text-transform: uppercase; width: 180px; }
.fuss { margin-top: 30px; text-align: center; }

@media (max-width: 760px) {
  .held { grid-template-columns: 1fr; } .held img { max-width: 160px; }
  .labor, .pse-bereich, .zuordnen { grid-template-columns: 1fr; }
  .proben { grid-template-columns: repeat(3, 1fr); }
  .rahmen { padding: 16px; } .aufgabe-innen { padding: 16px; } .fusszeile { padding: 14px 16px; }
  .buch { margin-left: 0; }
}
@media print {
  body { background: #fff; font-size: 12pt; }
  .kopf, .fuss, .nicht-drucken, .feier { display: none !important; }
  .heft-blatt { box-shadow: none; border: 0; padding: 0; }
  .heft-teil { break-inside: avoid; margin-bottom: 10pt; }
  .heft-teil h2 { font-size: 18pt; margin-bottom: 6pt; }
  .heft-teil ul { font-size: 11.5pt; gap: 1pt; }
  .heft-pse { margin-top: 6pt; gap: 16pt; }
  .heft-pse .pse { width: 255px; padding: 4px; gap: 2px; }
  .heft-pse .legende { font-size: 11pt; }
  .zelle { min-height: 0; font-size: 9pt; border-radius: 3px; }
  .pse .kopfz, .pse .per { font-size: 8pt; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @page { size: A4; margin: 14mm; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
/* Beamer-Seite: Einstieg (Mystery-Bilder) und Abschluss (Hinge-Frage + Auflösung). Läuft ohne Speicher. */
"use strict";
const B = window.BILDER || {};
function h(tag, attrs, ...kinder) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v; else if (k.startsWith("on")) el.addEventListener(k.slice(2), v); else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kind of kinder.flat()) if (kind != null && kind !== false) el.append(kind.nodeType ? kind : document.createTextNode(kind));
  return el;
}

const MYSTERY = [
  { bild: "m-zeppelin", was: "Zeppelin", stoff: "Helium", gruppe: "Edelgas", station: "Station 4: Helium brennt nicht." },
  { bild: "m-pfanne", was: "Pfanne", stoff: "Metall mit Fluor-Beschichtung", gruppe: "Metall und Halogen", station: "Station 1 und 3: Die Pfanne leitet Wärme, die Beschichtung enthält Fluor." },
  { bild: "m-schwimmbad", was: "Schwimmbad", stoff: "Chlor", gruppe: "Halogen", station: "Station 3: Chlor tötet Keime." },
  { bild: "m-mast", was: "Strommast", stoff: "Aluminium und Stahl", gruppe: "Metall", station: "Station 1: Aluminium leitet und ist leicht." },
  { bild: "m-neon", was: "Leuchtreklame", stoff: "Neon", gruppe: "Edelgas", station: "Station 4: Neon leuchtet orange-rot." },
  { bild: "m-topf", was: "Kochtopf", stoff: "Edelstahl", gruppe: "Metall (Legierung)", station: "Station 1: Metalle leiten Wärme." },
];
const STUFEN = ["?", "Metall", "kein Metall"];
const HINGE = {
  frage: "Brom ist bei Zimmertemperatur flüssig und ein Nichtmetall. Wo steht Brom im Periodensystem?",
  optionen: [
    ["A", "In der 7. Hauptgruppe bei den Halogenen", true, "Richtig: Brom ist ein Halogen, wie Fluor, Chlor und Iod."],
    ["B", "Ganz links bei den Metallen", false, "Wer das wählt, denkt: flüssig wie Quecksilber, also Metall. Aber Brom hat keine Metall-Eigenschaften."],
    ["C", "In der 8. Hauptgruppe bei den Edelgasen", false, "Wer das wählt, verwechselt die Gruppen. Edelgase sind reaktionsträge, Brom ist reaktionsfreudig."],
    ["D", "Auf der Treppe der Halbmetalle", false, "Wer das wählt, denkt: besonders, also Halbmetall. Brom ist aber ein Nichtmetall."],
  ],

const wurzel = document.getElementById("beamer");
let modus = location.hash === "#abschluss" ? "abschluss" : "einstieg";
const markierung = MYSTERY.map(() => 0);
let aufgeloest = false, hingeAuf = false;

function zeichne() {
  const reiter = h("nav", { class: "reiter-beamer", style: "display:flex;gap:8px;margin:16px 0" },
    [["einstieg", "Einstieg"], ["abschluss", "Abschluss"]].map(([id, t]) => h("button", { class: "knopf" + (modus === id ? "" : " zwei"), type: "button", onclick: () => { modus = id; location.hash = id; zeichne(); } }, t)));
  wurzel.replaceChildren(reiter, modus === "einstieg" ? einstieg() : abschluss());
}

function karten(mitAufloesung) {
  return h("div", { class: "kacheln", style: "grid-template-columns:repeat(3,1fr)" }, MYSTERY.map((m, i) => {
    const karte = h("button", { class: "kachel", type: "button", style: "min-height:0;padding:10px", onclick: () => {
      if (mitAufloesung) return; markierung[i] = (markierung[i] + 1) % STUFEN.length; zeichne();
    } },
      h("img", { src: B[m.bild] || "", alt: m.was, style: "height:auto;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin:0 0 8px" }),
      h("b", {}, m.was),
      mitAufloesung
        ? h("div", {}, h("div", { style: "font-weight:800;color:var(--gruen-tief);font-size:19px" }, m.stoff + " · " + m.gruppe), h("small", {}, m.station))
        : h("span", { class: "status", style: `font-size:18px;color:${["var(--grau)", "#8a5a36", "#7a6a10"][markierung[i]]}` }, STUFEN[markierung[i]]));
    return karte;
  }));
}

function einstieg() {
  return h("section", { class: "rahmen" },
    h("div", { class: "ueber" }, "Einstieg · ca. 10 Minuten"),
    h("h1", { style: "font-size:clamp(28px,4vw,42px);color:var(--gruen-tief);margin:4px 0 6px" }, "Warum nimmt man genau diesen Stoff?"),
    h("p", { class: "frage" }, "Sechs Dinge aus dem Alltag. Hinter jedem steckt ein besonderer Stoff. Tippt ein Bild an: Steckt da ein Metall drin oder nicht?"),
    karten(false),
    h("p", { class: "klein", style: "margin-top:14px" }, "Die Auflösung gibt es am Ende der Stunde (Reiter Abschluss). Bis dahin findet ihr es an den Stationen selbst heraus."));
}

function abschluss() {
  const hinge = h("div", { class: "aufgabe", style: "margin-bottom:20px" }, h("div", { class: "aufgabe-innen" },
    h("div", { class: "schritt-nr" }, "Blitz-Check · alle zeigen gleichzeitig A, B, C oder D mit den Fingern"),
    h("h2", {}, HINGE.frage),
    h("div", { class: "optionen" }, HINGE.optionen.map(([b, t, ok, erkl]) => h("div", { class: "option ohne-kreis" + (hingeAuf ? (ok ? " richtig" : "") : "") },

    h("div", { style: "margin-top:14px" }, h("button", { class: "knopf", type: "button", onclick: () => { hingeAuf = !hingeAuf; zeichne(); } }, hingeAuf ? "Auflösung ausblenden" : "Auflösen"))));
  return h("section", { class: "rahmen" },
    h("div", { class: "ueber" }, "Abschluss · ca. 5 Minuten"),
    h("h1", { style: "font-size:clamp(28px,4vw,40px);color:var(--gruen-tief);margin:4px 0 14px" }, "Was habt ihr herausgefunden?"),
    hinge,
    h("h2", { style: "color:var(--gruen-tief);margin:8px 0 10px" }, "Auflösung der Mystery-Bilder"),
    aufgeloest ? karten(true) : h("button", { class: "knopf zwei", type: "button", onclick: () => { aufgeloest = true; zeichne(); } }, "Mystery-Bilder auflösen"));
}
zeichne();
